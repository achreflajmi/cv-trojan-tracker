# ---- OPEN: the owner decides these before freezing (proposal #14) ----
open_items:
  - total_budget_eur: null # e.g. tier A ~EUR 5 (haiku + luna + flash-lite), tier B ~EUR 40 (+ terra, mistral), tier C ~EUR 210 (all 7)
  - models_in_scope: null # subset of `models` above that fits the budget (SPEC 3.9 asks for all 7)
  - max_tokens_review: >-
      Opus/Gemini Argon upper bounds are high because thinking may use all of max_tokens
      (4096). Lowering max_tokens lowers the upper bound that --confirm-budget must cover,
      at the risk of truncated answers (recorded as unparseable).
  - citations_verified: >-
      arXiv 2605.28999 and 2606.27287 verified 2026-11-06 (titles, authors, findings);
      Indeed RAPIDS (ACL 2026 Industry) still to verify.
