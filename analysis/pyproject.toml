[project]
name = "ctt-analysis"
version = "0.1.0"
description = "CV Trojan Tracker analysis: paired bootstrap CIs, A/A noise floor, Benjamini-Hochberg, figures"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.1",
  "pandas>=2.2",
  "scipy>=1.14",
  "matplotlib>=3.9",
  "pyyaml>=6.0",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[project.scripts]
ctt-analyze = "ctt_analysis.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ctt_analysis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
