name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A throwaway Postgres for the database tests (schema, idempotency, kill/resume).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ctt
          POSTGRES_PASSWORD: ci-only-password # not a secret: exists only inside this CI job
          POSTGRES_DB: ctt
        ports:
          - 5432:5432
        # Wait until Postgres accepts connections before the steps start.
        options: >-
          --health-cmd "pg_isready -U ctt -d ctt"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      # Redis for the BullMQ queue tests (Stage 5).
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://ctt:ci-only-password@localhost:5432/ctt
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      # poppler-utils provides pdftotext/pdftoppm, used by the extractor and hiding-method tests.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  # The analysis is checked independently of the TypeScript engine (SPEC 3.7).
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: analysis
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3 # this action publishes no moving major tag
        with:
          python-version: '3.12'
      # --locked fails if uv.lock is out of date, like pnpm --frozen-lockfile.
      - run: uv sync --locked
      - run: uv run pytest -q

  # The results page must build statically (SPEC Stage 7). In CI there are no real
  # results, so it builds from the clearly marked sample fixture.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ctt/web build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - run: test -f apps/web/out/index.html && test -f apps/web/out/methodology/index.html
