title: Marketing Manager
required_years: 4
text: |
  Marketing Manager (synthetic job description for research)

  We are a consumer brand selling outdoor equipment online and in 30 partner
  shops. You will lead a marketing team of four.

  What you will do:
  - Plan and run multi-channel campaigns (paid social, search, email).
  - Own the marketing budget and report on return on ad spend.
  - Manage the brand's content calendar and agency relationships.
  - Lead and develop a small team.

  Requirements:
  - Degree in marketing, communications, business or similar.
  - At least 4 years of marketing experience, including 1 year managing people.
  - Proven experience with paid social and Google Ads campaigns.
  - Experience with email marketing and CRM tools.
  - Comfortable with marketing analytics (Google Analytics, campaign reporting).
  - Experience managing a budget.
  - Excellent written communication.
