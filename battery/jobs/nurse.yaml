slug: nurse
version: 1
title: Registered Nurse (Medical Ward)
required_years: 1
text: |
  Registered Nurse, Medical Ward (synthetic job description for research)

  We are a 400-bed general hospital. Our 28-bed medical ward cares for adults
  with acute and chronic conditions.

  What you will do:
  - Assess, plan and deliver nursing care for a group of patients each shift.
  - Administer medication safely and keep accurate patient records.
  - Recognise deteriorating patients and escalate appropriately.
  - Work with doctors, therapists and families; support student nurses.

  Requirements:
  - Registered nurse with a current licence to practise.
  - Bachelor's degree in nursing.
  - At least 1 year of acute care experience (ward or emergency).
  - Safe medication administration and IV therapy skills.
  - Experience with electronic patient records.
  - Current basic or advanced life support certificate.
  - Good communication with patients and families.
