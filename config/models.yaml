# Models the tool may call. Model IDs live here only, never in code.
# key:        name used on the command line (--model <key>)
# provider:   which adapter to use
# model_id:   exact ID sent to the provider API
# max_tokens: output cap per call; also caps thinking tokens and the worst-case cost
# temperature: omit to use the provider default (SPEC 3.9)
# settings:   provider-specific; for anthropic:
#               thinking: omit | adaptive | disabled | between_tools
#                 (what is accepted depends on the model; check the model's docs)
#               effort: low | medium | high | xhigh | max (optional)
models:
  - key: fake
    provider: fake
    model_id: fake-scripted-1
    max_tokens: 1024

  # Anthropic large model. Thinking cannot be disabled on this model (400 on
  # `disabled`), so SPEC 3.9 "reasoning off" is approximated by the lowest effort,
  # and that is recorded with every run. Temperature omitted: docs say to omit it.
  # Source: https://platform.claude.com/docs/en/models/opus-5-5/migration-guide (2026-11-05)
  - key: claude-opus-5-5
    provider: anthropic
    model_id: claude-opus-5-5
    max_tokens: 4096
    settings:
      thinking: omit
      effort: low

  # Anthropic small model. Thinking is on by default but can be disabled at the
  # default effort, so reasoning is off as SPEC 3.9 asks.
  # Source: https://platform.claude.com/docs/en/models/haiku-5-5/whats-new-haiku-5-5 (2026-11-05)
  - key: claude-haiku-5-5
    provider: anthropic
    model_id: claude-haiku-5-5
    max_tokens: 1024
    settings:
      thinking: disabled
