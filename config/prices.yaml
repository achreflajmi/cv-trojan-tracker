# Prices come from a cited source with a date. The tool never guesses.
# Provider prices are in USD per million tokens; caps are in EUR (SPEC 4.5).
# max_prompt_tokens: the price only applies up to this prompt size (tiered pricing);
# the cost code refuses larger prompts rather than under-pricing them.

# ECB reference rate 2026-11-04: 1 EUR = 1.1267 USD, so 1 USD = 1 / 1.1267 = 0.8875 EUR.
usd_to_eur:
  rate: 0.8875
  date: 2026-11-04
  source: https://www.ecb.europa.eu/stats/eurofxref/eurofxref-daily.xml

models:
  # The fake adapter costs nothing; listed so cost code paths can run in tests.
  fake-scripted-1:
    input_usd_per_mtok: 0
    output_usd_per_mtok: 0
    date: 2026-11-05
    source: fake adapter, free

  claude-opus-5-5:
    input_usd_per_mtok: 4
    output_usd_per_mtok: 20
    date: 2026-11-05
    source: https://platform.claude.com/docs/en/about-claude/pricing

  # Prompts over 100,000 tokens cost $0.50 / $2.50; not used by this project's prompts.
  claude-haiku-5-5:
    input_usd_per_mtok: 0.1
    output_usd_per_mtok: 0.5
    max_prompt_tokens: 100000
    date: 2026-11-05
    source: https://platform.claude.com/docs/en/about-claude/pricing

  # OpenAI: standard tier. Prompts over 272K input tokens cost 2x input and 1.5x
  # output, so the price is capped there (max_prompt_tokens).
  # Model pages confirm the same prices: /api/docs/models/gpt-6.1-terra, /gpt-6-luna.
  gpt-6.1-terra:
    input_usd_per_mtok: 1
    output_usd_per_mtok: 5
    max_prompt_tokens: 272000
    date: 2026-11-05
    source: https://developers.openai.com/api/docs/pricing

  gpt-6-luna:
    input_usd_per_mtok: 0.1
    output_usd_per_mtok: 0.5
    max_prompt_tokens: 272000
    date: 2026-11-05
    source: https://developers.openai.com/api/docs/pricing

  # Google: paid tier, standard. Output price includes thinking tokens. Promotional
  # price: "$2.00 / $10.00 through November 30, 2026. $4.00 / $20.00 starting
  # December 1, 2026". valid_until makes the tool refuse to price calls after that
  # day, so the owner must enter the new price then. No prompt-size tiers.
  gemini-4-argon:
    input_usd_per_mtok: 2
    output_usd_per_mtok: 10
    valid_until: 2026-11-30
    date: 2026-11-05
    source: https://aistudio.google.com/docs/pricing

  gemini-3.5-flash-lite:
    input_usd_per_mtok: 0.3
    output_usd_per_mtok: 2.5
    date: 2026-11-05
    source: https://aistudio.google.com/docs/pricing

  # OpenRouter: price of the pinned endpoint "mistral/zdr" (the "mistral/eu" endpoint
  # costs $0.77 / $2.31). Token prices are passed through; OpenRouter's fee on buying
  # credits is not a per-token price and is not included here.
  # Same values in https://openrouter.ai/api/v1/models/mistralai/mistral-large-4-0/endpoints
  mistralai/mistral-large-4-0:
    input_usd_per_mtok: 0.7
    output_usd_per_mtok: 2.1
    date: 2026-11-05
    source: https://openrouter.ai/mistralai/mistral-large-4-0/providers
