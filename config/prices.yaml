# Prices come from a cited source with a date. The tool never guesses.
# Provider prices are in USD per million tokens; caps are in EUR (SPEC 4.5).
# max_prompt_tokens: the price only applies up to this prompt size (tiered pricing);
# the cost code refuses larger prompts rather than under-pricing them.

# ECB reference rate 2026-11-04: 1 EUR = 1.1267 USD, so 1 USD = 1 / 1.1267 = 0.8875 EUR.
usd_to_eur:
  rate: 0.8875
  date: 2026-11-04
  source: https://www.ecb.europa.eu/stats/eurofxref/eurofxref-daily.xml

models:
  # The fake adapter costs nothing; listed so cost code paths can run in tests.
  fake-scripted-1:
    input_usd_per_mtok: 0
    output_usd_per_mtok: 0
    date: 2026-11-05
    source: fake adapter, free

  claude-opus-5-5:
    input_usd_per_mtok: 4
    output_usd_per_mtok: 20
    date: 2026-11-05
    source: https://platform.claude.com/docs/en/about-claude/pricing

  # Prompts over 100,000 tokens cost $0.50 / $2.50; not used by this project's prompts.
  claude-haiku-5-5:
    input_usd_per_mtok: 0.1
    output_usd_per_mtok: 0.5
    max_prompt_tokens: 100000
    date: 2026-11-05
    source: https://platform.claude.com/docs/en/about-claude/pricing
